name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from source
        run: python -m pip install --no-deps .
      - name: Unit and conformance tests
        run: python -m unittest discover -s tests -v
      - name: CLI quick start
        run: |
          vlips demo --out "${{ runner.temp }}/vlips-demo"
          vlips validate "${{ runner.temp }}/vlips-demo" --require-level L2 --format json > "${{ runner.temp }}/validation.json"
          vlips validate "${{ runner.temp }}/vlips-demo" --require-level L4 --report "${{ runner.temp }}/validation-l4.json"
          vlips select tests/fixtures/candidates.csv --format json
      - name: Release audit
        run: python scripts/release_audit.py .
